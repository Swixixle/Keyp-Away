[project]
name = "keysmith"
version = "0.2.0"
description = "AI credential broker - reason about secrets without possessing them"
authors = [{ name = "Alex Maksimovich", email = "your-email@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "keyring>=24.0.0",
    "httpx>=0.27.0",
    "pyperclip>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
mcp = [
    "mcp>=1.2.0",
]

[project.scripts]
keysmith = "keysmith.cli.main:cli"
keysmith-mcp = "keysmith.mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["keysmith*"]

[tool.setuptools.package-data]
keysmith = ["providers/registry.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
